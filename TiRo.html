<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TiRo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap');
:root {
  --electric-border-color: #00ff9d;
  --status-color: #808080;
  --electric-light-color: oklch(from var(--electric-border-color) l c h);
  --gradient-color: oklch(from var(--electric-border-color) 0.3 calc(c / 2) h / 0.4);
  --color-neutral-900: oklch(0.185 0 0);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background-color:oklch(0.145 0 0);color:oklch(0.985 0 0);height:100vh;overflow:hidden}
.loading-screen{position:fixed;top:0;left:0;right:0;bottom:0;background-color:oklch(0.145 0 0);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s ease,visibility 0.5s ease}
.loading-screen.hidden{opacity:0;visibility:hidden}
.loader{position:relative;margin:auto;min-width:400px;height:120px;color:var(--electric-border-color);font-family:'Inter',sans-serif;font-size:280%;font-weight:700;background:linear-gradient(180deg,#1a1a1a 0%,#0f0f0f 100%);box-shadow:inset 0 5px 30px rgba(0,0,0,0.8),0 0 40px rgba(221,132,72,0.2);border-radius:12px;letter-spacing:8px;text-shadow:0 0 20px rgba(221,132,72,0.5);border:1px solid rgba(221,132,72,0.3);display:flex;justify-content:center;padding:0 20px}
.loader>span{height:120px;line-height:140px;flex:1;border-left:1px solid rgba(221,132,72,0.15);border-right:1px solid rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;max-width:100px}
.covers{position:absolute;height:100%;width:100%;border-radius:12px;overflow:hidden;display:flex;justify-content:center;padding:0 20px}
.covers span{flex:1;max-width:100px;background:linear-gradient(180deg,rgba(221,132,72,0.9) 0%,rgba(221,132,72,0.6) 100%);animation:up 2s infinite;box-shadow:0 0 15px rgba(221,132,72,0.4)}
@keyframes up{0%{margin-bottom:0}16%{margin-bottom:100%;height:25px}50%{margin-bottom:0}100%{margin-bottom:0}}
.covers span:nth-child(1){animation-delay:0s}
.covers span:nth-child(2){animation-delay:.25s}
.covers span:nth-child(3){animation-delay:.5s}
.covers span:nth-child(4){animation-delay:.75s}
.main-container{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;opacity:0;transition:opacity 0.5s ease}
.main-container.visible{opacity:1}
.svg-container{position:absolute}
.card-container{padding:2px;border-radius:24px;position:relative;background:linear-gradient(-30deg,var(--gradient-color),transparent,var(--gradient-color)),linear-gradient(to bottom,var(--color-neutral-900),var(--color-neutral-900))}
.inner-container{position:relative}
.border-outer{border:2px solid rgba(221,132,72,0.5);border-radius:24px;padding-right:4px;padding-bottom:4px}
.main-card{width:350px;height:500px;border-radius:24px;border:2px solid var(--electric-border-color);margin-top:-4px;margin-left:-4px;filter:url(#turbulent-displace)}
.glow-layer-1{border:2px solid rgba(221,132,72,0.6);border-radius:24px;width:100%;height:100%;position:absolute;top:0;left:0;right:0;bottom:0;filter:blur(1px)}
.glow-layer-2{border:2px solid var(--electric-light-color);border-radius:24px;width:100%;height:100%;position:absolute;top:0;left:0;right:0;bottom:0;filter:blur(4px)}
.overlay-1{position:absolute;width:100%;height:100%;top:0;left:0;right:0;bottom:0;border-radius:24px;opacity:1;mix-blend-mode:overlay;transform:scale(1.1);filter:blur(16px);background:linear-gradient(-30deg,white,transparent 30%,transparent 70%,white)}
.overlay-2{position:absolute;width:100%;height:100%;top:0;left:0;right:0;bottom:0;border-radius:24px;opacity:0.5;mix-blend-mode:overlay;transform:scale(1.1);filter:blur(16px);background:linear-gradient(-30deg,white,transparent 30%,transparent 70%,white)}
.background-glow{position:absolute;width:100%;height:100%;top:0;left:0;right:0;bottom:0;border-radius:24px;filter:blur(32px);transform:scale(1.1);opacity:0.3;z-index:-1;background:linear-gradient(-30deg,var(--electric-light-color),transparent,var(--electric-border-color))}
.content-container{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;display:flex;flex-direction:column}
.content-top{display:flex;flex-direction:column;padding:48px;padding-bottom:16px;flex:1;align-items:center;gap:24px}
.profile-picture{width:120px;height:120px;border-radius:50%;border: 3px solid var(--status-color); background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:bold;box-shadow:0 0 30px rgba(221,132,72,0.3);margin-top:24px;overflow:hidden;transition:border-color 0.4s,box-shadow 0.4s;position:relative}
.profile-picture img,.profile-picture canvas{width:100%;height:100%;object-fit:cover;border-radius:50%;position:absolute;top:0;left:0}
.profile-picture canvas{display:none}
.content-bottom{display:flex;flex-direction:column;padding:48px;padding-top:16px;gap:16px}
.footer{position:fixed;bottom:0;left:0;right:0;padding:16px;text-align:center;font-size:12px;opacity:0.4;background:oklch(0.145 0 0);border-top:1px solid rgba(255,255,255,0.1);z-index:999}
.scrollbar-glass{background:radial-gradient(47.2% 50% at 50.39% 88.37%,rgba(255,255,255,0.12) 0%,rgba(255,255,255,0) 100%),rgba(255,255,255,0.04);position:relative;transition:background 0.3s ease;border-radius:14px;width:fit-content;height:fit-content;padding:8px 16px;text-transform:uppercase;font-weight:bold;font-size:14px;color:rgba(255,255,255,0.8)}
.scrollbar-glass:hover{background:radial-gradient(47.2% 50% at 50.39% 88.37%,rgba(255,255,255,0.12) 0%,rgba(255,255,255,0) 100%),rgba(255,255,255,0.08)}
.scrollbar-glass::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;padding:1px;background:linear-gradient(150deg,rgba(255,255,255,0.48) 16.73%,rgba(255,255,255,0.08) 30.2%,rgba(255,255,255,0.08) 68.2%,rgba(255,255,255,0.6) 81.89%);border-radius:inherit;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:xor;-webkit-mask-composite:xor;pointer-events:none}
.friends-button{position:fixed;bottom:64px;right:24px;cursor:pointer;border:none;background:radial-gradient(47.2% 50% at 50.39% 88.37%,rgba(255,255,255,0.12) 0%,rgba(255,255,255,0) 100%),rgba(255,255,255,0.04);z-index:999}
.music-controls{position:fixed;bottom:64px;left:24px;display:flex;gap:12px;z-index:999}
.music-button,.settings-button{cursor:pointer;border:none;background:radial-gradient(47.2% 50% at 50.39% 88.37%,rgba(255,255,255,0.12) 0%,rgba(255,255,255,0) 100%),rgba(255,255,255,0.04);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all 0.3s ease;position:relative}
.music-button::before,.settings-button::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;padding:1px;background:linear-gradient(150deg,rgba(255,255,255,0.48) 16.73%,rgba(255,255,255,0.08) 30.2%,rgba(255,255,255,0.08) 68.2%,rgba(255,255,255,0.6) 81.89%);border-radius:inherit;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:xor;-webkit-mask-composite:xor;pointer-events:none}
.music-button:hover,.settings-button:hover{background:radial-gradient(47.2% 50% at 50.39% 88.37%,rgba(255,255,255,0.12) 0%,rgba(255,255,255,0) 100%),rgba(255,255,255,0.08)}
.music-button.hidden{display:none}
.music-button svg,.settings-button svg{width:20px;height:20px;fill:rgba(255,255,255,0.8)}
.theme-settings,.friends-panel{position:fixed;top:0;width:400px;height:100vh;background:oklch(0.185 0 0);transition:0.4s cubic-bezier(0.4,0,0.2,1);z-index:1000;display:flex;flex-direction:column;overflow-y:auto}
.theme-settings{left:-400px;border-right:2px solid var(--electric-border-color)}
.theme-settings.open{left:0}
.friends-panel{right:-400px;border-left:2px solid var(--electric-border-color)}
.friends-panel.open{right:0}
.panel-header{display:flex;justify-content:space-between;align-items:center;padding:32px;border-bottom:1px solid rgba(255,255,255,0.1)}
.panel-header h3{font-size:24px;font-weight:500;color:var(--electric-border-color)}
.close-button{background:none;border:none;color:oklch(0.985 0 0);font-size:32px;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;transition:background 0.2s}
.close-button:hover{background:rgba(255,255,255,0.1)}
.theme-settings-content{padding:24px}
.color-section{margin-bottom:32px}
.color-section h4{font-size:16px;font-weight:600;margin-bottom:16px;color:rgba(255,255,255,0.9)}
.color-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.color-preset{width:100%;aspect-ratio:1;border-radius:12px;border:3px solid transparent;cursor:pointer;transition:all 0.3s ease}
.color-preset:hover{transform:scale(1.1)}
.color-preset.active{border-color:rgba(255,255,255,0.8);box-shadow:0 0 20px currentColor}
.custom-color-picker{display:flex;gap:12px;align-items:center}
.custom-color-picker input[type="color"]{width:60px;height:60px;border:3px solid rgba(255,255,255,0.2);border-radius:12px;cursor:pointer;background:none}
.apply-custom-btn{flex:1;padding:16px;background:linear-gradient(135deg,var(--electric-border-color) 0%,var(--electric-light-color) 100%);border:none;border-radius:12px;color:white;font-weight:700;cursor:pointer;transition:all 0.3s ease}
.apply-custom-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(221,132,72,0.4)}
.title{font-size:36px;font-weight:500;margin-top:auto}
.description{opacity:0.5;white-space: pre-line;}
.divider{margin-top:auto;border:none;height:1px;background-color:currentColor;opacity:0.1;mask-image:linear-gradient(to right,transparent,black,transparent);-webkit-mask-image:linear-gradient(to right,transparent,black,transparent)}
.friends-list{padding:16px;overflow-y:auto;flex:1}
.friend-item{display:flex;align-items:center;gap:16px;padding:16px;border-radius:12px;text-decoration:none;color:oklch(0.985 0 0);transition:background 0.2s;margin-bottom:8px}
.friend-item:hover{background:rgba(255,255,255,0.05)}
.friend-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--electric-border-color),var(--electric-light-color));display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:20px;overflow:hidden;position:relative}
.friend-avatar img,.friend-avatar canvas{width:100%;height:100%;object-fit:cover;border-radius:50%;position:absolute;top:0;left:0}
.friend-avatar canvas{display:none}
</style>
</head>
<body>
<div class="loading-screen" id="loadingScreen">
<div class="loader" id="loaderText"></div>
</div>
<main class="main-container" id="mainContainer">
<svg class="svg-container"><defs><filter id="turbulent-displace" colorInterpolationFilters="sRGB" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="10" result="noise1" seed="1"/><feOffset in="noise1" dx="0" dy="0" result="offsetNoise1"><animate attributeName="dy" values="700;0" dur="6s" repeatCount="indefinite" calcMode="linear"/></feOffset><feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="10" result="noise2" seed="1"/><feOffset in="noise2" dx="0" dy="0" result="offsetNoise2"><animate attributeName="dy" values="0;-700" dur="6s" repeatCount="indefinite" calcMode="linear"/></feOffset><feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="10" result="noise1" seed="2"/><feOffset in="noise1" dx="0" dy="0" result="offsetNoise3"><animate attributeName="dx" values="490;0" dur="6s" repeatCount="indefinite" calcMode="linear"/></feOffset><feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="10" result="noise2" seed="2"/><feOffset in="noise2" dx="0" dy="0" result="offsetNoise4"><animate attributeName="dx" values="0;-490" dur="6s" repeatCount="indefinite" calcMode="linear"/></feOffset><feComposite in="offsetNoise1" in2="offsetNoise2" result="part1"/><feComposite in="offsetNoise3" in2="offsetNoise4" result="part2"/><feBlend in="part1" in2="part2" mode="color-dodge" result="combinedNoise"/><feDisplacementMap in="SourceGraphic" in2="combinedNoise" scale="30" xChannelSelector="R" yChannelSelector="B"/></filter></defs></svg>
<div class="card-container"><div class="inner-container"><div class="border-outer"><div class="main-card"></div></div><div class="glow-layer-1"></div><div class="glow-layer-2"></div></div><div class="overlay-1"></div><div class="overlay-2"></div><div class="background-glow"></div><div class="content-container"><div class="content-top"><div class="profile-picture" id="avatar-container"><img id="avatar-img" src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Loading_icon.gif" data-avatar="https://upload.wikimedia.org/wikipedia/commons/b/b1/Loading_icon.gif"><canvas id="avatar-canvas" width="120" height="120"></canvas></div><p class="title">TiRo</p></div><hr class="divider"/><div class="content-bottom"><p class="description">Living my best life doing nothing.</p></div></div></div>
<div class="music-controls">
<button class="settings-button" onclick="toggleThemeSettings()"><svg viewBox="0 0 24 24"><path d="M12 15.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5zm7.4-2.9l2.1-1.6c.2-.1.2-.4.1-.6l-2-3.5c-.1-.2-.4-.3-.6-.2l-2.5 1c-.5-.4-1.1-.7-1.7-1l-.4-2.6c0-.2-.3-.4-.5-.4h-4c-.3 0-.5.2-.5.4l-.4 2.6c-.6.2-1.1.6-1.7 1l-2.5-1c-.2-.1-.5 0-.6.2l-2 3.5c-.1.2 0 .5.1.6l2.1 1.6c0 .3-.1.6-.1.9 0 .3 0 .6.1.9l-2.1 1.6c-.2.1-.2.4-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.3.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6c.6-.2 1.1-.6 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5c.1-.2 0-.5-.1-.6l-2.1-1.6c0-.3.1-.6.1-.9 0-.3 0-.6-.1-.9z"/></svg></button>
</div>
<button class="friends-button scrollbar-glass" onclick="toggleFriends()">Friends</button>
<div class="footer"><p>TiRo (221192) | <span id="status-text">Checking...</span></p></div>
<div class="friends-panel" id="friendsPanel"><div class="panel-header"><h3>Friends</h3><button class="close-button" onclick="toggleFriends()">×</button></div><div class="friends-list" id="friendsList"></div></div>
<div class="theme-settings" id="themeSettings"><div class="panel-header"><h3>Theme Settings</h3><button class="close-button" onclick="toggleThemeSettings()">×</button></div><div class="theme-settings-content"><div class="color-section"><h4>Color Presets</h4><div class="color-presets"><button class="color-preset active" style="background:#dd8448" data-color="#dd8448" onclick="applyPresetColor('#dd8448')"></button><button class="color-preset" style="background:#e74c3c" data-color="#e74c3c" onclick="applyPresetColor('#e74c3c')"></button><button class="color-preset" style="background:#3498db" data-color="#3498db" onclick="applyPresetColor('#3498db')"></button><button class="color-preset" style="background:#2ecc71" data-color="#2ecc71" onclick="applyPresetColor('#2ecc71')"></button><button class="color-preset" style="background:#9b59b6" data-color="#9b59b6" onclick="applyPresetColor('#9b59b6')"></button><button class="color-preset" style="background:#f39c12" data-color="#f39c12" onclick="applyPresetColor('#f39c12')"></button><button class="color-preset" style="background:#1abc9c" data-color="#1abc9c" onclick="applyPresetColor('#1abc9c')"></button><button class="color-preset" style="background:#e91e63" data-color="#e91e63" onclick="applyPresetColor('#e91e63')"></button></div></div><div class="color-section"><h4>Custom Color</h4><div class="custom-color-picker"><input type="color" id="customColorPicker" value="#00ff9d"><button class="apply-custom-btn" onclick="applyCustomColor()">Apply Custom</button></div></div></div></div>
</main>
<script>
const friends=[{ username: 'Nicholas', url: 'https://xat.me/Nicholas' }];
function isSpriteSheet(img){return img.naturalWidth>img.naturalHeight&&img.naturalWidth%img.naturalHeight===0}
function animateAvatar(img,canvas,timerId){const url=img.getAttribute('data-avatar');const canvasSize=canvas.width;img.onload=function(){if(/\.gif$/i.test(url)||(img.naturalHeight===img.naturalWidth&&img.naturalHeight<=1758)){img.style.display='block';canvas.style.display='none';if(window[timerId])clearInterval(window[timerId])}else if(isSpriteSheet(img)){img.style.display='none';canvas.style.display='block';const frameSize=img.naturalHeight;const frameCount=img.naturalWidth/frameSize;let frame=0;const ctx=canvas.getContext('2d');if(window[timerId])clearInterval(window[timerId]);function drawFrame(){ctx.clearRect(0,0,canvasSize,canvasSize);ctx.drawImage(img,frame*frameSize,0,frameSize,frameSize,0,0,canvasSize,canvasSize);frame=(frame+1)%frameCount}drawFrame();window[timerId]=setInterval(drawFrame,140)}else{img.style.display='block';canvas.style.display='none';if(window[timerId])clearInterval(window[timerId])}};img.src=url}
function showAvatar(){const img=document.getElementById('avatar-img');const canvas=document.getElementById('avatar-canvas');if(!img||!canvas)return;animateAvatar(img,canvas,'avatarTimer')}
function loadFriends(){const friendsList=document.getElementById('friendsList');friendsList.innerHTML='<div style="text-align:center;padding:20px;color:#94a3b8;">Loading friends...</div>';let loadedCount=0;const friendElements=[];friends.forEach((friend,index)=>{fetch(`https://pythbots.com/api/userinfo.php?user=${friend.username}`).then(r=>r.json()).then(data=>{let avatarUrl='https://xat.com/web_gear/chat/av/0.png';if(data.avatar){const parts=data.avatar.split('#');if(/^\d+$/.test(parts[0])){avatarUrl=`https://xat.com/web_gear/chat/av/${parts[0]}.png`}else if(parts[0].startsWith('http')){avatarUrl=parts[0]}}const friendItem=document.createElement('a');friendItem.href=friend.url;friendItem.target='_blank';friendItem.className='friend-item';const avatarDiv=document.createElement('div');avatarDiv.className='friend-avatar';const avatarImg=document.createElement('img');avatarImg.src='https://upload.wikimedia.org/wikipedia/commons/b/b1/Loading_icon.gif';avatarImg.setAttribute('data-avatar',avatarUrl);avatarImg.style.display='block';const avatarCanvas=document.createElement('canvas');avatarCanvas.width=48;avatarCanvas.height=48;avatarCanvas.style.display='none';avatarDiv.appendChild(avatarImg);avatarDiv.appendChild(avatarCanvas);const nameSpan=document.createElement('span');nameSpan.textContent=friend.username;friendItem.appendChild(avatarDiv);friendItem.appendChild(nameSpan);friendElements[index]=friendItem;animateAvatar(avatarImg,avatarCanvas,`friendTimer${index}`);loadedCount++;if(loadedCount===friends.length){friendsList.innerHTML='';friendElements.forEach(el=>friendsList.appendChild(el))}}).catch(()=>{const friendItem=document.createElement('a');friendItem.href=friend.url;friendItem.target='_blank';friendItem.className='friend-item';const avatarDiv=document.createElement('div');avatarDiv.className='friend-avatar';avatarDiv.textContent=friend.username.charAt(0).toUpperCase();const nameSpan=document.createElement('span');nameSpan.textContent=friend.username;friendItem.appendChild(avatarDiv);friendItem.appendChild(nameSpan);friendElements[index]=friendItem;loadedCount++;if(loadedCount===friends.length){friendsList.innerHTML='';friendElements.forEach(el=>friendsList.appendChild(el))}})})}
function updateProfileFromAPI(data){const statusText=document.getElementById('status-text');if(data.is_online){statusText.textContent='Available';statusText.style.color='#077424'}else{statusText.textContent='Offline';statusText.style.color='#808080'}const avatarImg=document.getElementById('avatar-img');if(data.avatar){const avatarUrl=data.avatar.split('#')[0];avatarImg.setAttribute('data-avatar',avatarUrl);showAvatar()}if(data.is_online===true){document.documentElement.style.setProperty('--status-color','#077424')}else{document.documentElement.style.setProperty('--status-color','#808080')}}
function fetchProfile(){fetch('https://pythbots.com/api/userinfo.php?user=TiRo').then(r=>r.json()).then(updateProfileFromAPI).catch(()=>{const statusText=document.getElementById('status-text');statusText.textContent='Offline';statusText.style.color='#808080'})}
function toggleThemeSettings(){document.getElementById('themeSettings').classList.toggle('open')}
function toggleFriends(){document.getElementById('friendsPanel').classList.toggle('open')}
function applyPresetColor(color){document.documentElement.style.setProperty('--electric-border-color',color);document.querySelectorAll('.color-preset').forEach(btn=>{btn.classList.remove('active');if(btn.dataset.color===color)btn.classList.add('active')});document.getElementById('customColorPicker').value=color}
function applyCustomColor(){const color=document.getElementById('customColorPicker').value;document.documentElement.style.setProperty('--electric-border-color',color);document.querySelectorAll('.color-preset').forEach(btn=>btn.classList.remove('active'))}
window.addEventListener('load',function(){
const username='TiRo'.toUpperCase();
const loader=document.getElementById('loaderText');
let html='';
for(let i=0;i<username.length;i++){html+='<span>'+username[i]+'</span>'}
html+='<div class="covers">';
for(let i=0;i<username.length;i++){html+='<span style="animation-delay:'+(i*0.25)+'s"></span>'}
html+='</div>';
loader.innerHTML=html;
setTimeout(function(){document.getElementById('loadingScreen').classList.add('hidden');document.getElementById('mainContainer').classList.add('visible');fetchProfile();setInterval(fetchProfile,30000);loadFriends()},4000)});
</script>
</body>
</html>
