<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>TiRo</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
:root{--theme-color:#504949;--status-color:#808080}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card{position:relative;padding:2px;border-radius:24px;background:linear-gradient(-30deg,var(--theme-color),transparent,var(--theme-color))}
.inner{position:relative;width:400px;height:550px;border-radius:24px;border:2px solid var(--theme-color);background:#1a1a1a;padding:40px;display:flex;flex-direction:column;align-items:center}
.glow{position:absolute;inset:0;border-radius:24px;border:2px solid var(--theme-color);opacity:0.6;filter:blur(4px);pointer-events:none}
.avatar{width:120px;height:120px;border-radius:50%;margin:20px 0;overflow:hidden;position:relative;border:3px solid var(--theme-color);box-shadow:0 0 30px var(--theme-color)66;}
.avatar img,.avatar canvas{width:100%;height:100%;object-fit:cover;border-radius:50%;position:absolute;top:0;left:0}
.avatar canvas{display:none}
.title{font-size:2.5em;font-weight:700;margin:10px 0;background:linear-gradient(135deg,var(--theme-color),#fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.desc{opacity:0.7;text-align:center;margin:10px 0;white-space: pre-line;}
.friends{margin:20px 0;display:flex;flex-wrap:wrap;justify-content:center}
</style>
</head><body>
<div class="card">
  <div class="inner">
    <div class="glow"></div>
    <img src="https://xatimg.com/image/TGrnDceu0BiF.gif" style="width:100%;height:120px;object-fit:cover;border-radius:16px;margin-bottom:-60px">
    <div class="avatar">
      <img id="avatarImg" src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Loading_icon.gif" data-avatar="https://upload.wikimedia.org/wikipedia/commons/b/b1/Loading_icon.gif">
      <canvas id="avatarCanvas" width="120" height="120"></canvas>
      <div class="status-dot" style="position:absolute;bottom:5px;right:5px;width:24px;height:24px;border-radius:50%;background:var(--status-color);border:3px solid #1a1a1a;box-shadow:0 0 10px var(--status-color);"></div>
    </div>
    <div class="title">TiRo</div>
    <div class="desc">Living my best life doing nothing.</div>
    <div class="friends"><a href="https://xat.me/Nicholas" target="_blank" style="margin:0 10px;font-size:12px;color:#636363;text-decoration:none;font-weight:600">BFF</a></div>
  </div>
</div>
<script>
function isSpriteSheet(img){return img.naturalWidth>img.naturalHeight&&img.naturalWidth%img.naturalHeight===0}
function animateAvatar(){const img=document.getElementById('avatarImg');const canvas=document.getElementById('avatarCanvas');if(!img||!canvas)return;const url=img.getAttribute('data-avatar');img.onload=function(){if(/\.gif$/i.test(url)||(img.naturalHeight===img.naturalWidth&&img.naturalHeight<=1758)){img.style.display='block';canvas.style.display='none';if(window.avatarTimer)clearInterval(window.avatarTimer)}else if(isSpriteSheet(img)){img.style.display='none';canvas.style.display='block';const frameSize=img.naturalHeight;const frameCount=img.naturalWidth/frameSize;let frame=0;const ctx=canvas.getContext('2d');if(window.avatarTimer)clearInterval(window.avatarTimer);function drawFrame(){ctx.clearRect(0,0,120,120);ctx.drawImage(img,frame*frameSize,0,frameSize,frameSize,0,0,120,120);frame=(frame+1)%frameCount}drawFrame();window.avatarTimer=setInterval(drawFrame,140)}else{img.style.display='block';canvas.style.display='none';if(window.avatarTimer)clearInterval(window.avatarTimer)}};img.src=url}
animateAvatar();

function updateProfile() {
    fetch('https://pythbots.com/api/userinfo.php?user=TiRo')
        .then(r => r.json())
        .then(data => {
            console.log('API Response:', data);
            
            const img = document.getElementById('avatarImg');
            if (data.avatar) {
                // Split by # and take first URL
                const avatarUrl = data.avatar.split('#')[0];
                console.log('Avatar URL:', avatarUrl);
                img.setAttribute('data-avatar', avatarUrl);
                animateAvatar();
            }
            
            
            // Update status color based on is_online
            console.log('Online status:', data.is_online);
            if (data.is_online === true) {
                document.documentElement.style.setProperty('--status-color', '#077424');
            } else {
                document.documentElement.style.setProperty('--status-color', '#808080');
            }
            
        })
        .catch(err => console.error('API error:', err));
}
updateProfile();
setInterval(updateProfile, 30000);

</script>
</body></html>
